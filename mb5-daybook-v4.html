<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MB5 Day Book</title>
<style>
  :root{
    --pine:#2d5a4a; --marker:#e0a800; --grey:#6b6b63; --accent:#8a6d3b;
    --bg:#f6f5f0; --card:#ffffff; --ink:#25291f; --line:#e5e3d8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:78px}
  h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;font-weight:400;margin:0 0 8px}
  header{padding:16px 100px 8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  #hdr{font-size:15px;color:var(--grey)}
  #view{padding:12px 14px 24px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:20px;margin-bottom:10px}
  .row{display:flex;gap:8px;margin:8px 0}
  .row input,.row select{flex:1;min-width:0}
  input,select,textarea{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  input[type="checkbox"],input[type="radio"]{width:16px;height:16px;padding:0;flex:0 0 auto}
  textarea{min-height:70px;resize:vertical}
  label{font-size:14px}
  .btn{display:block;width:100%;background:var(--pine);color:#fff;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px}
  .btn:disabled{opacity:.6}
  .btn.quiet{background:transparent;color:var(--pine);border:1.5px solid var(--pine);margin-top:8px}
  .chip{border:1.5px solid var(--pine);background:transparent;color:var(--pine);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;margin:2px 4px 2px 0}
  .chip.on{background:var(--pine);color:#fff} .chip.add{border-style:dashed;font-weight:400}
  .chip.urgent{border-color:#c0392b;color:#c0392b} .chip.urgent.on{background:#c0392b;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{border:1.5px solid var(--pine);background:transparent;color:var(--pine);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .tabs button.on{background:var(--pine);color:#fff}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfaf6}
  .rec{border-bottom:1px solid var(--line);padding:8px 0;font-size:15px;cursor:pointer}
  .rec:last-child{border-bottom:0}
  .rec.done{opacity:.5;text-decoration:line-through}
  .rec.incident{border-left:3px solid #c0392b;padding-left:8px}
  .note{background:#f4f1e8;border-radius:8px;padding:8px 10px;font-size:14px;margin:6px 0;color:#4a4636}
  .hint,.muted{color:var(--grey);font-size:13px}
  .empty{color:var(--grey);font-style:italic}
  .x,.del{background:none;border:0;color:var(--grey);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px}
  .del{float:right}
  .sub{font-size:14px;color:var(--grey);margin-top:10px}
  .total{font-size:20px;font-weight:700;color:var(--pine)}
  .calc{font-size:13px;color:var(--grey);margin:2px 0 6px}
  #rep,#repx,#repm{white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;background:#f4f1e8;border-radius:8px;padding:10px 12px;max-width:100%;overflow-x:hidden}
  a{color:var(--pine)}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;padding:8px 1px 10px;font:inherit;font-size:10px;line-height:1.25;color:var(--grey);cursor:pointer}
  nav button.on{color:var(--pine);font-weight:700;border-top:3px solid var(--marker);margin-top:-1px}
  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center}
  #lightbox img{max-width:92%;max-height:92%;border-radius:8px}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#25291f;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;z-index:60}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #qaBtns{position:fixed;top:14px;right:12px;z-index:45;display:flex;gap:6px}
  #qaBtns button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--pine);background:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);padding:0}
  #qaPanel{position:fixed;top:58px;right:12px;z-index:46;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.22);max-width:260px;max-height:65vh;overflow-y:auto;padding:10px 12px;display:none}
  #qaPanel.show{display:block}
  #qaPanel .qi{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  #qaPanel .qi:last-child{border-bottom:0}
  .photos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .ph{position:relative;display:inline-block}
  .ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .ph button{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border:0;border-radius:50%;width:20px;height:20px;line-height:18px;font-size:13px;cursor:pointer;padding:0}
</style>
</head>
<body>
<header><h1 style="font-size:19px">MB5 Day Book</h1><span id="hdr"></span></header>
<div id="qaBtns"><button onclick="toggleQuickPanel('phone')" title="Important numbers">📞</button><button onclick="openComposeFromAnywhere()" title="Compose an email">✉️</button></div>
<div id="qaPanel"></div>
<div id="view"></div>
<nav>
  <button data-v="capture" class="on">✍️<br>Capture</button>
  <button data-v="buckets">🗂️<br>Entries</button>
  <button data-v="docs">📄<br>Paperwork</button>
  <button data-v="training">🎓<br>Training</button>
  <button data-v="about">👪<br>About us</button>
  <button data-v="settings">⚙️<br>Rates</button>
</nav>
<div id="lightbox" onclick="this.style.display='none'"><img></div>
<div id="toast"></div>
<script>

const KEY='mb5-daybook-v4';
const BUILD='2026-08-30-overnight-accuracy-fix';
const BUCKETS={diary:'Diary',supervision:'Supervision',expenses:'Expenses',meds:'Medication',sw:'Social worker log',incident:'Incident',scratch:'Just record'};
const FLAGS={
 sexualised:{label:'Sexualised behaviour',urgent:true,guidance:"Record the exact words/actions, the time, place and who was present — don't ask leading questions. Tell your SSW and both children's social workers today. Whether and how it's investigated is their judgement, not yours."},
 disclosure:{label:'Possible disclosure',urgent:true,guidance:"Stop. Record the child's exact words. No follow-up questions, no examination. Phone your SSW today — and the child's own social worker too if that's someone else."},
 injury:{label:'Unexplained injury or mark',urgent:true,guidance:"Photograph it if you haven't already. Note what explanation was given, by whom, and when. Tell your SSW today."},
 allegation:{label:'Allegation against an adult',urgent:true,guidance:"Don't investigate it or put it to the adult concerned. Record the exact words. Contact your SSW today — this may need LADO involvement."},
 missing:{label:'Child missing or ran off',urgent:true,guidance:"Follow your safer-care plan. If not already resolved, this needs your SSW and the police informed without delay."},
 contact:{label:'Contact cancelled or missed',urgent:false,guidance:"Check with the social worker whether it will be rearranged, and let the child know what's happening. Note how they reacted."},
 health:{label:'New or worsening health issue',urgent:false,guidance:"Consider whether this needs a GP appointment, and whether the SSW should be told."},
 school:{label:'School incident or exclusion risk',urgent:false,guidance:"Tell your SSW. Consider whether a PEP review is needed."},
 reminder:{label:'Reminder',urgent:false,guidance:''},
 training:{label:'Training suggestion',urgent:false,guidance:''}
};
function flagGuidance(r){return ['reminder','training'].includes(r.flag)?(r.flagNote||r.text):(FLAGS[r.flag]||{}).guidance||''}
function courseTitle(note){return esc((note||'').split(' — ')[0])}
function reminderFlagIcon(note){return /\b(expense|invoice|invoicing|pay|paid|payment|£|claim|reimburse|receipt|day ?care|mileage)\b/i.test(note||'')?'💷':'🔔'}
function flagIcon(r){return r.flag==='training'?'💡':r.flag==='reminder'?reminderFlagIcon(r.flagNote||r.text):'⚠'}
function findCourse(title){for(const [,,rows] of TRAINING){const hit=rows.find(r=>r[0]===title);if(hit)return hit}return null}
function trainingRow(r,note,keyPrefix){const key=keyPrefix+r.id+'-t';const open=window._flagOpen===key;
  const course=findCourse((note||'').split(' — ')[0]);const url=course?platUrl(course[2]):'';
  return `<div class="rec" style="margin-top:2px" onclick="event.stopPropagation();window._flagOpen=window._flagOpen==='${key}'?null:'${key}';render()">
    💡 <b>Training suggestion</b> · ${courseTitle(note)} <small class="muted">${open?'':'— tap for details'}</small>
    ${open?`<div class="note">${esc(note)}</div>${url?`<a class="chip" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open ↗</a> `:''}<button class="chip" onclick="event.stopPropagation();view='training';render()">View in Training list</button> <button class="chip on" onclick="event.stopPropagation();markFlagDone('${r.id}')">Mark done</button>`:''}</div>`}
const BANDS=['0-4','5-10','11-13','14-18'];
const DEFAULT_RATES={
  label:'Surrey CC, April 2026',
  mileage:0.45, dailyDeduct:20,
  hourFirst:12.71, hourAdd:10.17,
  dayFirst:{'0-4':63.57,'5-10':67.76,'11-13':79.53,'14-18':87.15},
  dayAdd:{'0-4':50.86,'5-10':54.21,'11-13':63.62,'14-18':69.72},
  overnight:{'0-4':93.06,'5-10':97.24,'11-13':109.02,'14-18':120.08},
};
// children: [{name,band,home:true/false}]  records: {id,bucket,child,text,date,done,created, kind:'purchase'|'mileage'|'daycare', amount, miles, hours, overnight, kids:[names]}
let data={children:[],records:[],contacts:[],carer:'',diaries:{},household:{adults:[]},handovers:{},reminders:[],rota:[],settings:{diaryEvery:'monthly',invoiceDay:1,payDay:28},rates:JSON.parse(JSON.stringify(DEFAULT_RATES))};
let mem=false, view='capture', tab='all', erange='7d', pending=[], busy=false;
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const ERANGES=[['7d','Last 7 days'],['30d','Last 30 days'],['month','This month'],['all','All time'],['custom','Choose exact dates…']];
function inRange(d,range){if(range==='all'||!d)return true;if(range==='month')return d.slice(0,7)===today().slice(0,7);
  if(range==='custom'){const from=window._efrom||'',to=window._eto||'';if(from&&d<from)return false;if(to&&d>to)return false;return true}
  const days=range==='7d'?6:29;const cutoff=new Date(Date.now()-days*24*60*60*1000).toISOString().slice(0,10);return d>=cutoff}
const fmt=(iso,o={day:'numeric',month:'short'})=>new Date(iso+'T12:00').toLocaleDateString('en-GB',o);
const gbp=n=>'£'+Number(n||0).toFixed(2);
const names=()=>data.children.map(c=>c.name);
function ageOf(c,on=new Date()){if(!c.born)return null;const [y,m]=c.born.split('-').map(Number);let a=on.getFullYear()-y;if(on.getMonth()+1<m)a--;return a}
function bandOf(c,on){const a=ageOf(c,on);if(a===null)return c.band||'5-10';return a<5?'0-4':a<11?'5-10':a<14?'11-13':'14-18'}
const familyOf=n=>(data.children.find(c=>c.name===n)||{}).family||'';
const band=n=>bandOf(data.children.find(c=>c.name===n)||{});
function bandChange(c){if(!c.born)return '';const now=bandOf(c);for(let i=1;i<=3;i++){const d=new Date();d.setMonth(d.getMonth()+i);if(bandOf(c,d)!==now)return `moves to ${bandOf(c,d)} in ${d.toLocaleDateString('en-GB',{month:'short'})}`}return ''}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}

function applyData(raw){if(!raw)return;const d=JSON.parse(raw);data={...data,...d};if(!data.rates)data.rates=JSON.parse(JSON.stringify(DEFAULT_RATES));if(!data.contacts)data.contacts=[];if(!data.diaries)data.diaries={};if(!data.training)data.training={};if(!data.household)data.household={};if(!data.household.adults)data.household.adults=[];if(!data.household.sswName){const donor=data.household.adults.find(a=>a.sswName);if(donor){data.household.sswName=donor.sswName;data.household.sswPhone=donor.sswPhone||'';data.household.sswEmail=donor.sswEmail||'';data.household.sswManagerName=donor.sswManagerName||'';data.household.sswManagerPhone=donor.sswManagerPhone||'';data.household.sswManagerEmail=donor.sswManagerEmail||'';data.household.sswStart=donor.sswStart||''}}if(!data.handovers)data.handovers={};if(!data.reminders)data.reminders=[];if(data.seeded!==4){seedProfiles();data.seeded=4}if(!data.rota||!data.rota.length)data.rota=SEED_ROTA.slice();else{const have=new Set(data.rota.map(r=>r.d));SEED_ROTA.forEach(r=>{if(!have.has(r.d))data.rota.push(r)});data.rota.sort((a,b)=>a.d.localeCompare(b.d))}if(!data.settings)data.settings={diaryEvery:'monthly',invoiceDay:1,payDay:28};if(!data.settings.payDay)data.settings.payDay=28}
function hasLS(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}}
async function load(){
  let raw=null;
  try{const r=await window.storage.get(KEY,false);if(r&&r.value)raw=r.value}catch(e){}
  if(!raw&&hasLS()){try{raw=localStorage.getItem(KEY)}catch(e){}}
  try{applyData(raw)}catch(e){}
  if(data.seeded!==4){seedProfiles();data.seeded=4;save()}
  if(rescanRecords())save();
}
let undoStack=[];
function pushUndo(label){undoStack.push({label,snapshot:JSON.stringify(data)});if(undoStack.length>15)undoStack.shift()}
function undoLast(){if(!undoStack.length)return;const last=undoStack.pop();data=JSON.parse(last.snapshot);save();render();toast('Restored: '+last.label)}
async function save(){
  const raw=JSON.stringify(data); let ok=false;
  try{if(window.storage){const r=await window.storage.set(KEY,raw,false);ok=!!r}}catch(e){}
  if(!ok&&hasLS()){try{localStorage.setItem(KEY,raw);ok=true}catch(e){}}
  if(!ok&&!mem){mem=true;toast('No storage here — use Backup in Rates to keep your data')}
}
function exportData(){const raw=JSON.stringify(data);const el=$('#backup');el.value=raw;el.select();try{navigator.clipboard.writeText(raw);toast('Copied — paste it somewhere safe')}catch(e){toast('Select all and copy')}}
function importData(){const raw=$('#backup').value.trim();if(!raw)return;try{applyData(raw);save();toast('Restored');render()}catch(e){toast('That doesn’t look like a backup')}}

/* ---------- editing saved entries ---------- */
function editForm(r){const i=data.records.indexOf(r);const sel=(k,opts)=>`<select onchange="data.records[${i}].${k}=this.value;render()">${opts.map(o=>`<option value="${o[0]}"${r[k]===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;
  let h=`<div onclick="event.stopPropagation()"><div class="row"><select onchange="data.records[${i}].bucket=this.value;data.records[${i}].alsoIn=[];render()">${Object.entries(BUCKETS).map(([k,l])=>`<option value="${k}"${r.bucket===k?' selected':''}>${l}</option>`).join('')}</select><input type="date" value="${r.date}" onchange="data.records[${i}].date=this.value"><select onchange="data.records[${i}].child=this.value"><option value="">no child</option>${names().map(n=>`<option${r.child===n?' selected':''}>${n}</option>`).join('')}</select></div>
  ${r.bucket!=='expenses'?alsoInSelectRecord(i,r):''}
  <textarea rows="4" style="width:100%" onchange="data.records[${i}].text=this.value">${r.text||''}</textarea>`;
  if(r.bucket==='expenses'){h+=`<div class="row">${sel('kind',[['purchase','purchase'],['mileage','mileage'],['daycare','day care']])}`;
    if(r.kind==='purchase')h+=`<input type="number" inputmode="decimal" step="0.01" placeholder="£" value="${r.amount||''}" onchange="data.records[${i}].amount=this.value">`;
    if(r.kind==='mileage')h+=`<input type="number" inputmode="decimal" placeholder="miles" value="${r.miles||''}" onchange="data.records[${i}].miles=this.value">`;
    h+=`</div>`;
    if(r.kind==='daycare'){h+=`<div class="row" style="flex-wrap:wrap">${names().map(n=>`<button class="chip${(r.kids||[]).includes(n)?' on':''}" style="flex:0 0 auto" onclick="const k=data.records[${i}].kids=data.records[${i}].kids||[];const j=k.indexOf('${n}');j<0?k.push('${n}'):k.splice(j,1);render()">${n}</button>`).join('')}</div>
      <div class="row"><input type="time" value="${r.from||''}" onchange="data.records[${i}].from=this.value;render()"><input type="time" value="${r.to||''}" onchange="data.records[${i}].to=this.value;render()"><input type="number" inputmode="decimal" step="0.25" placeholder="or hrs" style="flex:0 0 70px" value="${r.hours||''}" onchange="data.records[${i}].hours=this.value;render()"><label style="margin:0;display:flex;align-items:center;gap:6px"><input type="checkbox" style="width:auto" ${r.overnight?'checked':''} onchange="data.records[${i}].overnight=this.checked;render()">overnight</label></div>
      <div class="row"><select onchange="data.records[${i}].reason=this.value" style="flex:1"><option value="">Reason for day care…</option>${['Carer respite','Carer appointment','Carer training','Carer work','Sibling contact','Emergency','Other'].map(o=>`<option${r.reason===o?' selected':''}>${o}</option>`).join('')}</select></div><div class="calc">${gbp(daycareAmount(r))}</div>`}}
  h+=`<div class="row" style="align-items:center;margin-top:4px"><span class="muted" style="flex:0 0 auto">⚠ Follow-up</span><select style="flex:1" onchange="data.records[${i}].flag=this.value;data.records[${i}].flagDone=false;data.records[${i}].flagCleared=!this.value;data.records[${i}].trainingNote='';attachTrainingSuggestion([data.records[${i}]]);render()"><option value="">None</option>${Object.entries(FLAGS).map(([k,f])=>`<option value="${k}"${r.flag===k?' selected':''}>${f.label}</option>`).join('')}</select></div>
  ${r.flag?(['reminder','training'].includes(r.flag)?`<textarea placeholder="${r.flag==='training'?'Suggested course — edit if needed':'What to remind you to do'}" onchange="data.records[${i}].flagNote=this.value">${r.flagNote||''}</textarea>${r.flag==='training'&&r.flagNote?(()=>{const c=findCourse(r.flagNote.split(' — ')[0]);const u=c?platUrl(c[2]):'';return u?`<a class="chip" href="${u}" target="_blank" rel="noopener">Open ↗</a>`:''})():''}`:`<div class="note">${esc(FLAGS[r.flag].guidance)}</div>`):''}
  <div class="row"><span class="muted">📷</span><input type="file" accept="image/*" style="flex:1;padding:6px;font-size:14px" onchange="addPhotoRec(${i},this)"></div>
  <div class="row"><button class="btn" style="flex:1" onclick="data.records[${i}].edited=new Date().toISOString();save();window._edit=null;render();toast('Updated')">Done</button></div></div>`;return h}
function addPhotoRec(i,input){const file=input.files&&input.files[0];if(!file)return;const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=1000;let w=img.width,h=img.height;if(w>h&&w>max){h=h*max/w;w=max}else if(h>max){w=w*max/h;h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);(data.records[i].photos=data.records[i].photos||[]).push(c.toDataURL('image/jpeg',0.72));URL.revokeObjectURL(url);save();render()};img.src=url}
/* ---------- photos ---------- */
function addPhoto(i,input){const file=input.files&&input.files[0];if(!file)return;const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=1000;let w=img.width,h=img.height;if(w>h&&w>max){h=h*max/w;w=max}else if(h>max){w=w*max/h;h=max}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const d=c.toDataURL('image/jpeg',0.72);URL.revokeObjectURL(url);(pending[i].photos=pending[i].photos||[]).push(d);render()};
  img.onerror=()=>toast('Couldn’t read that photo');img.src=url}
function photoStrip(list,editIdx){if(!(list||[]).length)return '';return `<div class="photos">${list.map((d,j)=>`<span class="ph"><img src="${d}" onclick="event.stopPropagation();showPhoto(${JSON.stringify(d).replace(/"/g,'&quot;')})">${editIdx!=null?`<button onclick="pending[${editIdx}].photos.splice(${j},1);render()">×</button>`:''}</span>`).join('')}</div>`}

function dueList(){const out=[];const now=new Date();const t=today();
  // incidents not yet reported
  data.records.filter(r=>r.bucket==='incident'&&!r.reported).forEach(r=>{const h=(now-new Date(r.created))/36e5;out.push({k:'inc',urgent:true,text:`Incident not yet reported${h>24?' — over 24 hours':' — '+Math.max(0,Math.round(24-h))+' hrs left'}: ${r.text.slice(0,60)}…`,go:'incident',id:r.id})});
  // invoice / expenses
  const d=now.getDate();const last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  if(d>=last-3)out.push({k:'inv',text:'Month end in '+(last-d)+' day'+(last-d===1?'':'s')+' — check expenses & day-care reasons before invoicing',go:'month'});
  if(d<=Number(data.settings.invoiceDay||1)+2)out.push({k:'inv2',text:'Send last month\'s expenses claim to Surrey',go:'month'});
  if(Math.abs(d-Number(data.settings.payDay||28))<=1&&data.records.some(r=>r.bucket==='expenses'&&r.claimed&&!r.paid))out.push({k:'payday',text:'Payday around now — check claimed expenses have actually been paid',go:'docs',doc:'expenses'});
  // diary due
  const ev=data.settings.diaryEvery||'monthly';const lastDiary=Object.keys(data.diaries).map(k=>k.split('|')[2]).filter(Boolean).sort().pop();
  const gap=lastDiary?(now-new Date(lastDiary))/864e5:99;if((ev==='weekly'&&gap>=7)||(ev==='monthly'&&gap>=28))out.push({k:'diary',text:`Diary for social worker due (${ev}${lastDiary?', last one to '+fmt(lastDiary):''})`,go:'docs',doc:'diary'});
  // band changes
  data.children.forEach(c=>{const b=bandChange(c);if(b)out.push({k:'band',text:`${c.name} ${b} — day-care rate changes`,go:'settings'})});
  // training renewals
  TRAINING.filter(x=>x[0]==='3yr').forEach(([g,_,rows])=>rows.forEach(([t])=>{const st=trainStatus(g,t);if(st.s==='over'||st.s==='soon')out.push({k:'train',urgent:st.s==='over',text:`Training: ${t} — ${st.l}`,go:'training'})}));
  // essential phone numbers missing
  const ESSENTIAL=[['ssw','SSW'],['csw',"CSW"],['sswm',"SSW's manager"],['duty','Team duty line'],['gp','GP']];
  data.children.forEach(c=>{const b=c.basics||{};const miss=ESSENTIAL.filter(([k])=>!(b[k]||'').trim()).map(([,l])=>l);if(miss.length)out.push({k:'nums-'+c.name,text:`${c.name}: add ${miss.join(', ')} — About us`,go:'about'})});

  if(!hubCarers().length)out.push({k:'hubnum',text:'Add yourself (and any other hub carer) as a contact labelled "Hub carer" — Rates → Contacts',go:'settings'});
  // custom
  data.reminders.filter(r=>!r.done).forEach(r=>{if(r.date<=t)out.push({k:'custom',urgent:r.date<t,text:r.text+(r.date<t?' (overdue '+fmt(r.date)+')':''),custom:r.id})});
  return out}

function egressFile(subject,body){

  const name=subject.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()+'.txt';
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  let done=false;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();done=true}catch(e){}
  if(navigator.share){try{const file=new File([text],name,{type:'text/plain'});const p=navigator.canShare&&navigator.canShare({files:[file]})?{files:[file],title:subject,text:text}:{title:subject,text:text};navigator.share(p).catch(()=>{})}catch(e){}}
  if(!done)toast('Couldn’t save the file here — open the app in Safari or Chrome');
}

async function draftComposeEmail(){const c=window._compose;

${entries.length?entries.map(r=>`- ${fmt(r.date)} (${BUCKETS[r.bucket]}): ${r.text}`).join('\n'):'(no specific entries selected)'}
${c.other.trim()?`- Also: ${c.other.trim()}`:''}

Write a complete, ready-to-send email in the requested tone, in British English, weaving in the source material naturally rather than listing it. Keep it warm but professional regardless of tone chosen, appropriate for someone communicating about a child in their care. Do not sign off with a name, since the carer will add their own. The body is plain text, not HTML — never use tags like <br> or <p>; use a blank line between paragraphs instead. Respond with ONLY this JSON, no prose, no markdown: {"subject":"...","body":"..."}`;
  try{

      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,system:sys,messages:[{role:'user',content:'Draft the email.'}]})});

  busy=false;render()}

function linkMentionedChildren(p){const found=namesInText(p.text);if(!found.length)return false;const before=(p.kids||[]).length;const kids=new Set(p.kids||[]);found.forEach(n=>kids.add(n));p.kids=[...kids];if(!p.child&&p.kids.length)p.child=p.kids[0];return p.kids.length>before}
function syncKid(p){if(!p.kids)p.kids=p.child?[p.child]:[];p.child=p.kids[0]||'';return p}
/* ---------- money ---------- */
function hoursOf(r){if(r.from&&r.to){const [a,b]=[r.from,r.to].map(t=>{const [h,m]=t.split(':').map(Number);return h+m/60});let d=b-a;if(d<0)d+=24;return Math.round(d*4)/4}return Number(r.hours||0)}
function bornOf(k){const c=data.children.find(x=>x.name===k);return c&&c.born?c.born:'9999-99'}
function eldestOf(kids){return kids.slice().sort((a,b)=>bornOf(a).localeCompare(bornOf(b)))[0]}
function daycareAmount(r){
  const R=data.rates, kids=(r.kids||[]).length?r.kids:['?']; let t=0;
  const byFam={}; kids.forEach(k=>{const fam=familyOf(k)||('solo-'+k);(byFam[fam]=byFam[fam]||[]).push(k)});
  Object.values(byFam).forEach(group=>{const eldest=eldestOf(group);
    group.forEach(k=>{const b=band(k), first=(k===eldest);
      if(r.overnight) t+=R.overnight[b]*(first?1:0.8);
      else if(hoursOf(r)>=5) t+=first?R.dayFirst[b]:R.dayAdd[b];
      else t+=hoursOf(r)*(first?R.hourFirst:R.hourAdd);});});
  return t;
}
// Cross-record daycare pricing: expands every daycare/overnight record into one priced event per child,
// drops a child's daytime hours for a date already covered by their own overnight that date, and gives the
// first-child (full) rate to whichever child in the family is eldest, applied across separate records for
// the same date, not just within one record.
function daycareEvents(recs){
  const dc=recs.filter(r=>r.kind==='daycare').slice().sort((a,b)=>(a.created||'').localeCompare(b.created||''));
  const overnightKeys=new Set();
  dc.filter(r=>r.overnight).forEach(r=>(r.kids||[]).forEach(k=>overnightKeys.add(r.date+'|'+k)));
  const events=[];
  dc.forEach(r=>{
    const kids=(r.kids||[]).length?r.kids:['?'];
    kids.forEach(k=>{
      const key=r.date+'|'+k;
      if(!r.overnight&&overnightKeys.has(key))return;
      events.push({date:r.date,kid:k,overnight:r.overnight,hours:hoursOf(r),reason:r.reason,text:r.text,recordId:r.id,from:r.from,to:r.to});
    });
  });
  const groups={};
  events.forEach(e=>{const fam=familyOf(e.kid)||('solo-'+e.kid), key=e.date+'|'+fam;(groups[key]=groups[key]||[]).push(e)});
  Object.values(groups).forEach(grp=>{const eldest=eldestOf(grp.map(e=>e.kid));grp.forEach(e=>{e.first=(e.kid===eldest)})});
  events.forEach(e=>{
    const b=band(e.kid);
    const R=data.rates;
    if(e.overnight) e.amount=R.overnight[b]*(e.first?1:0.8);
    else if(e.hours>=5) e.amount=e.first?R.dayFirst[b]:R.dayAdd[b];
    else e.amount=e.hours*(e.first?R.hourFirst:R.hourAdd);
  });
  return events;
}
// mileage is priced per day: total miles that day minus the daily deduction
function mileageForDay(date, recs){
  const rs=recs.filter(r=>r.kind==='mileage'&&r.date===date);
  const miles=rs.reduce((s,r)=>s+Number(r.miles||0),0);
  return {miles, claimable:Math.max(0,miles-data.rates.dailyDeduct), amount:Math.max(0,miles-data.rates.dailyDeduct)*data.rates.mileage};
}
function expenseTotals(recs){
  let purchase=0,mileage=0; const days=new Set();
  recs.forEach(r=>{if(r.kind==='mileage')days.add(r.date);else if(r.kind!=='daycare')purchase+=Number(r.amount||0)});
  days.forEach(d=>mileage+=mileageForDay(d,recs).amount);
  const daycare=daycareEvents(recs).reduce((s,e)=>s+e.amount,0);
  return {purchase,daycare,mileage,total:purchase+daycare+mileage};
}
function describe(r){
  if(r.kind==='mileage') return `${r.miles} miles — ${r.text}`;
  if(r.kind==='daycare') return `${(r.kids||[]).length?(r.kids||[]).join(' & '):'⚠ no child linked — priced as one child, band 5–10'} ${r.overnight?'overnight':(r.from&&r.to?r.from+'–'+r.to+' ('+hoursOf(r)+' hrs)':Number(r.hours)+' hrs')} — ${gbp(daycareAmount(r))}${r.reason?' — '+r.reason:' — ⚠ no reason given'}${r.text?' — '+r.text:''}`;
  return `${gbp(r.amount)} — ${r.text}`;
}

function dropRedundantDaycare(pendingList){
  const overnightKeys=new Set();
  data.records.filter(r=>r.bucket==='expenses'&&r.kind==='daycare'&&r.overnight).forEach(r=>(r.kids||[]).forEach(k=>overnightKeys.add(r.date+'|'+k)));
  pendingList.filter(p=>p.bucket==='expenses'&&p.kind==='daycare'&&p.overnight).forEach(p=>(p.kids||[]).forEach(k=>overnightKeys.add(p.date+'|'+k)));
  let dropped=0;
  const kept=pendingList.filter(p=>{
    if(!(p.bucket==='expenses'&&p.kind==='daycare'&&!p.overnight))return true;
    const kids=p.kids||[]; if(!kids.length)return true;
    const covered=kids.every(k=>overnightKeys.has(p.date+'|'+k));
    if(covered)dropped++;
    return !covered});
  if(dropped)toast(dropped+' daycare item'+(dropped===1?'':'s')+' skipped — already covered by an overnight stay that day');
  const byDateTotal={},byDateOvernight={};
  kept.filter(p=>p.bucket==='expenses'&&p.kind==='daycare').forEach(p=>{byDateTotal[p.date]=(byDateTotal[p.date]||0)+1;if(p.overnight)byDateOvernight[p.date]=(byDateOvernight[p.date]||0)+1});
  const suspectDates=Object.keys(byDateTotal).filter(d=>byDateTotal[d]>1&&byDateOvernight[d]===byDateTotal[d]);
  if(suspectDates.length&&!dropped)toast('Check overnight carefully for '+suspectDates.map(d=>fmt(d)).join(', ')+' — every child came out overnight. If one actually went home, untick their overnight box before saving.');
  return kept}
async function sortIt(){
  const text=$('#cap').value.trim(); if(!text)return; window._cap=text; busy=true; render();
  const courses=TRAINING.flatMap(([,,rows])=>rows.map(r=>r[0]));
  const sys=`You sort a UK foster carer's spoken notes into buckets. Buckets: diary (day-to-day observations about a child), supervision (things to raise with the supervising social worker at next supervision), expenses (money spent, miles driven, or day care / babysitting provided for other carers' children), meds (a specific dose of medication given to a child), sw (log of contact with a social worker: calls, visits, what was agreed), incident (serious events needing formal reporting: injury, unexplained bruise, allegation, restraint, going missing, police), scratch (anything the carer says to "just record" or that fits nowhere).
Children known: ${names().join(', ')||'unknown'}. Match spoken names to these where obvious. If the carer names where something goes, obey. Otherwise choose sensibly; use scratch when unsure. Split into separate items if there are several things. Keep the carer's words, tidied for a written record, British English. Never add facts.
For expenses set "kind": "purchase" (amount in pounds), "mileage" (miles driven, one item per journey, round trip if they say so), or "daycare" (care given: from/to clock times if the carer says them, otherwise hours; kids = the child cared for, overnight true if they stayed the night). Daycare and overnight are always ONE ITEM PER CHILD, even when several children were cared for on the same occasion at the same time — never combine two children into one daycare item, because their rates and circumstances (hours vs overnight) can differ. Overnight is set INDIVIDUALLY per child based on what actually happened to THAT child — read carefully who is said to have stayed versus who is said to have gone home, been collected, returned to their own carer, or otherwise ended their day. When several children were cared for together but only some stayed the night, only those specific children get overnight true; a child described as leaving, going home, or returning to their own carer always gets overnight false with their actual hours, never overnight true just because another child in the same sentence stayed over. If a child stayed overnight, create only the overnight item for them — never also create a separate daytime-hours item for that same child on that occasion, since the overnight rate already covers the whole period; only children who did NOT stay over get a daytime item.
For meds, set "medName" (the medicine given), "dose" (quantity or strength as said, e.g. "5ml" or "1 tablet"), "given" (the time given, HH:MM, or the current time-of-day if only vaguely implied), and "givenBy" (who gave it — the carer's own name if they say "I gave" or "I've given", otherwise whoever they name). One item per child per medicine given, even if several children were given the same or different medicines at the same time — never combine children into one meds item.
Also set "flag" on any item that needs a follow-up: one of sexualised, disclosure, injury, allegation, missing, contact, health, school, reminder, or null. Use "reminder" only when the carer explicitly asks to be reminded or told to do something later (e.g. "remind me to tell the SSW about the dentist") — set "flagNote" to that instruction in their words. Never set "flag" to "training" — the app adds a matching course itself when it's relevant, you don't need to. For the other flags leave flagNote null unless there's a short specific detail worth adding (e.g. which child, what was said) — don't write advice yourself, the app supplies that. Be cautious: only set a safeguarding flag (sexualised, disclosure, injury, allegation, missing) when the text actually describes that happening, not just the word appearing in passing.
Separately, also consider whether any course from this list could help the carer with what's described — behaviour, emotions, relationships between children, safer caring, health, education, contact with family, or general parenting: ${courses.join(' | ')}. If one is plausibly useful, set "training" to {"course":"<exact title from the list above>","why":"<one short clause>"}; otherwise null. Err on the side of suggesting — the carer can dismiss it in one tap if it's not needed, so only leave it null when nothing on the list is even loosely relevant.
Respond with ONLY a JSON array, no prose, no markdown: [{"bucket":"diary","child":"name or empty","text":"...","kind":"purchase|mileage|daycare|null","amount":number|null,"miles":number|null,"from":"HH:MM or null","to":"HH:MM or null","reason":"one of Carer respite/Carer appointment/Carer training/Carer work/Sibling contact/Emergency/Other or null — the reason the OTHER carer needed cover, if said","hours":number|null,"kids":["names"],"overnight":false,"medName":"string or null","dose":"string or null","given":"HH:MM or null","givenBy":"string or null","flag":"sexualised|disclosure|injury|allegation|missing|contact|health|school|reminder|null","flagNote":"string or null","training":{"course":"string","why":"string"} or null}]`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,system:sys,messages:[{role:'user',content:text}]})});
    const d=await r.json();
    if(d.error)throw new Error(d.error.message||'API error');
    if(!d.content)throw new Error('Empty reply');
    const out=d.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();

  busy=false; render();
}

    <div class="row" style="margin-top:6px"><input type="month" value="${c.born||''}" style="flex:1" title="Month and year of birth" onchange="data.children[${i}].born=this.value;save();render()"><input value="${c.family||''}" placeholder="Household / carer" style="flex:1" onchange="data.children[${i}].family=this.value.trim();save()"></div>
    <div class="row" style="margin-top:6px"><select style="flex:1" onchange="data.children[${i}].livesHere=this.value==='1';data.children[${i}].category='';render()"><option value="">— lives with us, or visits? —</option><option value="1"${lh===true?' selected':''}>Lives with us</option><option value="0"${lh===false?' selected':''}>Visits (sleepover / daycare / short break — varies, no need to pick one)</option></select></div>
    ${lh===true?`<div class="row" style="margin-top:6px"><select style="flex:1" onchange="data.children[${i}].category=this.value;render()"><option value="">— category —</option>${LIVES_CATS.map(([k,l])=>`<option value="${k}"${c.category===k?' selected':''}>${l}</option>`).join('')}</select></div>`:''}
    ${isSA?`<p class="hint" style="margin-top:8px">Important contact at Surrey</p><textarea placeholder="Name · phone · email" onchange="data.children[${i}].surreyContact=this.value">${esc(c.surreyContact||'')}</textarea>`:''}
    <p class="hint" style="margin-top:8px">Mockingbird</p>
    <select style="flex:1" onchange="const v=this.value;data.children[${i}].mockingbird=v;if(v==='mb5'){data.children[${i}].hubCarerName=MY_HUB_CARER.name;data.children[${i}].hubCarerPhone=MY_HUB_CARER.phone;data.children[${i}].hubCarerEmail=MY_HUB_CARER.email}render()"><option value="">— not set —</option>${MB_OPTIONS.map(([k,l])=>`<option value="${k}"${c.mockingbird===k?' selected':''}>${l}</option>`).join('')}</select>
    ${['mb5','another'].includes(c.mockingbird)?`<p class="hint" style="margin-top:6px">Hub carer name</p><input value="${esc(c.hubCarerName||'')}" onchange="data.children[${i}].hubCarerName=this.value.trim();save()">
    <p class="hint" style="margin-top:6px">Hub carer phone</p><input type="tel" value="${esc(c.hubCarerPhone||'')}" onchange="data.children[${i}].hubCarerPhone=this.value.trim();save()">
    <p class="hint" style="margin-top:6px">Hub carer email</p><input type="email" value="${esc(c.hubCarerEmail||'')}" onchange="data.children[${i}].hubCarerEmail=this.value.trim();save()">`:''}`
  :`<div class="muted">${c.born?fmt(c.born+'-01',{month:'long',year:'numeric'})+' · ':''}${bandOf(c)} band${c.family?' · '+esc(c.family):''}${c.category?' · '+(CATEGORIES.find(x=>x[0]===c.category)||[,c.category])[1]:(lh===false?' · Visits us':'')}</div>
    ${isSA&&c.surreyContact?`<div class="note" style="margin-top:6px">Surrey contact: ${linkify(c.surreyContact)}</div>`:''}
    ${c.mockingbird?`<div class="note" style="margin-top:6px">Mockingbird: ${(MB_OPTIONS.find(x=>x[0]===c.mockingbird)||[,c.mockingbird])[1]}${['mb5','another'].includes(c.mockingbird)&&(c.hubCarerName||c.hubCarerPhone||c.hubCarerEmail)?'<br>Hub carer: '+esc(c.hubCarerName||'')+(c.hubCarerPhone?' · <a href="tel:'+esc(c.hubCarerPhone)+'">'+esc(c.hubCarerPhone)+'</a>':'')+(c.hubCarerEmail?' · <a href="mailto:'+esc(c.hubCarerEmail)+'">'+esc(c.hubCarerEmail)+'</a>':''):''}</div>`:''}
    ${lh===undefined?`<p class="note" style="margin-top:6px">Not set yet — tap Edit.</p>`:''}`}
  <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><button class="chip" onclick="togglePlacement('${esc(c.name)}')">${placementOpen(c.name)?'▾':'▸'} Placement & professionals</button>${placementOpen(c.name)?placementBasicsBlock(c.name):''}</div>
  </div>`}
function about(v){v.innerHTML=`<div class="card"><h3>About us</h3>
  <p class="hint">Everyone in the household — so it's all in one place, not scattered across contacts.</p>
  <h4 style="margin:14px 0 4px;color:var(--accent)">Adults</h4>
  ${data.household.adults.length?data.household.adults.map((a,i)=>adultCard(a,i)).join(''):'<p class="empty">None yet.</p>'}
  <button class="chip add" onclick="addAdult()">+ adult</button>${adultForm()}
  ${data.household.adults.some(a=>a.role==='Foster carer')?sswCard():''}
  <h4 style="margin:20px 0 4px;color:var(--accent)">Other contacts</h4><p class="hint" style="margin:0 0 6px">For children who visit from other families, add their carer here with the label "Carer" and link them to the child — "Send to carer" on an entry then picks them first. Who entries can be sent to — use their Egress / work addresses.</p>
    ${data.contacts.map((c,i)=>`<div class="item"><div class="row"><input value="${c.label}" placeholder="SSW / CSW / Hub" style="flex:0 0 90px" onchange="data.contacts[${i}].label=this.value;save()"><input value="${c.name||''}" placeholder="Name" onchange="data.contacts[${i}].name=this.value;save()"><button class="x" onclick="pushUndo('${esc(c.label||c.name||'Contact')} deleted');data.contacts.splice(${i},1);save();render()">×</button></div>
    <div class="row" style="margin-top:6px"><input value="${c.phone||''}" placeholder="Phone" type="tel" onchange="data.contacts[${i}].phone=this.value.trim();save()"><input value="${c.email}" placeholder="email address" type="email" inputmode="email" onchange="data.contacts[${i}].email=this.value.trim();save()"><select style="flex:0 0 90px" onchange="data.contacts[${i}].child=this.value;save()"><option value="">any child</option>${names().map(n=>`<option${c.child===n?' selected':''}>${n}</option>`).join('')}</select></div></div>`).join('')}
    <button class="chip add" onclick="data.contacts.push({label:'SSW',name:'',phone:'',email:''});save();render()">+ contact</button>
    ${data.contacts.some(c=>isStructuralLabel(c.label))?`<button class="chip quiet" onclick="tidyStructuralContacts()">Tidy up duplicate SSW/CSW contacts</button>`:''}
  <h4 style="margin:20px 0 4px;color:var(--accent)">Children — living with us</h4>
  ${data.children.filter(c=>livesHereOf(c)!==false).length?data.children.map((c,i)=>[c,i]).filter(([c])=>livesHereOf(c)!==false).map(([c,i])=>childCard(c,i)).join(''):'<p class="empty">None yet.</p>'}
  <h4 style="margin:20px 0 4px;color:var(--accent)">Children — visiting (sleepover / daycare / short break)</h4>
  ${data.children.map((c,i)=>[c,i]).filter(([c])=>livesHereOf(c)===false).length?data.children.map((c,i)=>[c,i]).filter(([c])=>livesHereOf(c)===false).map(([c,i])=>childCard(c,i)).join(''):'<p class="empty">None yet.</p>'}
  <button class="chip add" onclick="addChild()">+ child</button>${childForm()}
  </div>`}
const ADULT_ROLES=['Foster carer','Adult child','Live-in grandparent','Other'];
function addAdult(){window._addingAdult=true;render()}
function adultForm(){return window._addingAdult?`<div style="margin-top:8px"><input id="newAdultName" placeholder="Name" style="width:100%" autocomplete="off" spellcheck="false">
  <div class="row" style="margin-top:6px"><input id="newAdultPhone" placeholder="Phone" type="tel" style="flex:1"><input id="newAdultEmail" placeholder="Email" type="email" style="flex:1"></div>
  <div class="row" style="margin-top:6px"><select id="newAdultRole" style="flex:1">${ADULT_ROLES.map(r=>`<option>${r}</option>`).join('')}</select><button class="chip" style="flex:0 0 auto" onclick="confirmAdult()">Add</button><button class="x" onclick="window._addingAdult=false;render()">×</button></div></div>`:''}
function confirmAdult(){const n=$('#newAdultName').value.trim();if(!n)return;data.household.adults.push({name:n,phone:$('#newAdultPhone').value.trim(),email:$('#newAdultEmail').value.trim(),role:$('#newAdultRole').value});window._addingAdult=false;save();render()}
function adultCard(a,i){const ed=window._adultEdit===i;
  return `<div class="item"><div class="row" style="align-items:center"><b style="flex:1">${esc(a.name)}</b><button class="chip" onclick="window._adultEdit=${ed?'null':i};render()">${ed?'Done':'Edit'}</button><button class="x" onclick="pushUndo('${esc(a.name)} deleted');data.household.adults.splice(${i},1);save();render()">×</button></div>
  ${ed?`<div class="row" style="margin-top:6px"><input value="${esc(a.name)}" placeholder="Name" style="flex:1" onchange="data.household.adults[${i}].name=this.value.trim();save();render()"></div>
    <div class="row" style="margin-top:6px"><input value="${esc(a.phone||'')}" placeholder="Phone" type="tel" style="flex:1" onchange="data.household.adults[${i}].phone=this.value.trim();save()"><input value="${esc(a.email||'')}" placeholder="Email" type="email" style="flex:1" onchange="data.household.adults[${i}].email=this.value.trim();save()"></div>
    <div class="row" style="margin-top:6px"><select style="flex:1" onchange="data.household.adults[${i}].role=this.value;render()">${ADULT_ROLES.map(r=>`<option${a.role===r?' selected':''}>${r}</option>`).join('')}</select></div>`
  :`<div class="muted">${a.role||'—'}${a.phone?' · <a href="tel:'+esc(a.phone)+'">'+esc(a.phone)+'</a>':''}${a.email?' · <a href="mailto:'+esc(a.email)+'">'+esc(a.email)+'</a>':''}</div>`}</div>`}
function sswCard(){const h=data.household;const ed=window._sswEdit;
  return `<div class="item"><div class="row" style="align-items:center"><b style="flex:1">Supervising social worker</b><span class="muted" style="flex:0 0 auto;margin-right:8px">shared by all foster carers here</span><button class="chip" onclick="window._sswEdit=${ed?'false':'true'};render()">${ed?'Done':'Edit'}</button></div>
  ${ed?`<p class="hint" style="margin-top:8px">SSW — name</p><input value="${esc(h.sswName||'')}" onchange="data.household.sswName=this.value.trim();save()">
    <p class="hint" style="margin-top:6px">SSW — phone</p><input type="tel" value="${esc(h.sswPhone||'')}" onchange="data.household.sswPhone=this.value.trim();save()">
    <p class="hint" style="margin-top:6px">SSW — email</p><input type="email" value="${esc(h.sswEmail||'')}" onchange="data.household.sswEmail=this.value.trim();save()">
    <p class="hint" style="margin-top:8px">SSW's manager — name</p><input value="${esc(h.sswManagerName||'')}" onchange="data.household.sswManagerName=this.value.trim();save()">
    <p class="hint" style="margin-top:6px">Manager — phone</p><input type="tel" value="${esc(h.sswManagerPhone||'')}" onchange="data.household.sswManagerPhone=this.value.trim();save()">
    <p class="hint" style="margin-top:6px">Manager — email</p><input type="email" value="${esc(h.sswManagerEmail||'')}" onchange="data.household.sswManagerEmail=this.value.trim();save()">
    <p class="hint" style="margin-top:6px">Date they started as SSW</p><input type="date" value="${h.sswStart||''}" onchange="data.household.sswStart=this.value;save()">`
  :`${h.sswName||h.sswManagerName?`<div class="note" style="margin-top:6px">${h.sswName?'SSW: '+esc(h.sswName)+(h.sswPhone?' · <a href="tel:'+esc(h.sswPhone)+'">'+esc(h.sswPhone)+'</a>':'')+(h.sswEmail?' · <a href="mailto:'+esc(h.sswEmail)+'">'+esc(h.sswEmail)+'</a>':''):''}${h.sswManagerName?'<br>Manager: '+esc(h.sswManagerName)+(h.sswManagerPhone?' · <a href="tel:'+esc(h.sswManagerPhone)+'">'+esc(h.sswManagerPhone)+'</a>':'')+(h.sswManagerEmail?' · <a href="mailto:'+esc(h.sswManagerEmail)+'">'+esc(h.sswManagerEmail)+'</a>':''):''}${h.sswStart?'<br>Started: '+fmt(h.sswStart):''}</div>`:'<p class="empty" style="margin-top:6px">Not set yet.</p>'}`}</div>`}
function settings(v){
  const R=data.rates;
  const num=(path,val)=>`<input type="number" step="0.01" value="${val}" onchange="setRate('${path}',this.value)">`;
  v.innerHTML=`<div class="card"><h3>Children</h3>
    ${data.children.length?`<table><tr><th>Name</th><th>Band</th></tr>${data.children.map(c=>`<tr><td>${esc(c.name)}</td><td>${bandOf(c)}${ageOf(c)!==null?` (${ageOf(c)})`:''}<small style="display:block;color:var(--grey)">${bandChange(c)}</small></td></tr>`).join('')}</table>`:'<p class="empty">None yet.</p>'}
    <button class="chip" style="margin-top:8px" onclick="view='about';render()">Manage children in About us →</button>
    <p class="hint">Day-care rate band is worked out from month and year of birth, and updates as they grow.</p></div>
  <div class="card"><h3>Rates — ${R.label}</h3>
    <label>Mileage, £ per mile</label>${num('mileage',R.mileage)}
    <label>Miles deducted per day</label>${num('dailyDeduct',R.dailyDeduct)}
    <label>Day care under 5 hours, £ per hour — first child / additional child</label>
    <div class="row">${num('hourFirst',R.hourFirst)}${num('hourAdd',R.hourAdd)}</div>
    <label>Day care 5+ hours (Level 3) — first / additional</label>
    <table>${BANDS.map(b=>`<tr><td>${b}</td><td>${num('dayFirst.'+b,R.dayFirst[b])}</td><td>${num('dayAdd.'+b,R.dayAdd[b])}</td></tr>`).join('')}</table>
    <label>Overnight</label>
    <table>${BANDS.map(b=>`<tr><td>${b}</td><td>${num('overnight.'+b,R.overnight[b])}</td></tr>`).join('')}</table>
    <label>Label (e.g. the year of the document)</label><input value="${R.label}" onchange="setRate('label',this.value)">
    <button class="btn quiet" onclick="data.rates=JSON.parse(JSON.stringify(DEFAULT_RATES));save();render()">Reset to April 2026 rates</button>
    <p class="note">Siblings: give them the same household name. The first child from a household is paid at the first-child rate, brothers and sisters at the additional-child rate. Children from different households each count as a first child.</p>
    <h3 style="margin-top:20px">Out-of-hours rota</h3>
    <p class="muted">${data.rota.length} days loaded (${data.rota.length?fmt(data.rota[0].d)+' to '+fmt(data.rota[data.rota.length-1].d):'none'}). When next month's rota arrives, open the Word file, select all, copy, and paste it here.</p>
    <textarea id="rotaTxt" rows="3" style="width:100%" placeholder="Paste the whole rota document text here"></textarea><button class="btn" onclick="importRota()">Load rota</button>
    <h3 style="margin-top:20px">Reminders</h3>
    <div class="row"><label style="flex:1">Diary to SW <select onchange="data.settings.diaryEvery=this.value;save()"><option value="weekly"${data.settings.diaryEvery==='weekly'?' selected':''}>weekly</option><option value="monthly"${data.settings.diaryEvery!=='weekly'?' selected':''}>monthly</option></select></label>
    <label style="flex:1">Invoice by day <input type="number" min="1" max="28" value="${data.settings.invoiceDay||1}" style="width:60px" onchange="data.settings.invoiceDay=this.value;save()"></label>
    <label style="flex:1">Pay day <input type="number" min="1" max="28" value="${data.settings.payDay||28}" style="width:60px" onchange="data.settings.payDay=this.value;save()"></label></div>
    <h3 style="margin-top:20px">Backup</h3>
    <p class="muted">Copy this text somewhere safe (a note on your phone). Paste it back here and tap Restore to get everything back.</p>
    <textarea id="backup" rows="3" style="width:100%;font-size:11px"></textarea>
    <button class="btn" onclick="exportData()">Copy backup</button><button class="btn quiet" onclick="importData()">Restore</button>
    <p class="note">Additional children overnight are costed at 80% — the document doesn't say, so check that one. Update these each April from the new finance document.</p>
    <p class="muted" style="margin-top:20px">Build ${BUILD} · <button class="chip" onclick="const n=rescanRecords();save();toast(n?n+' entr'+(n===1?'y':'ies')+' flagged':'Nothing new to flag');render()">Rescan entries for follow-ups</button></p></div>`;
}
function setRate(path,val){const [a,b]=path.split('.');if(b)data.rates[a][b]=Number(val);else data.rates[a]=a==='label'?val:Number(val);save();toast('Rate updated')}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
load().then(render);

</script>
</body>
</html>
